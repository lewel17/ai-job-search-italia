<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Dashboard</title>
<style>
  :root {
    --drafted: #64748b; --active: #3b82f6; --interview: #f59e0b;
    --offer: #8b5cf6; --hired: #22c55e; --closed: #ef4444;
    --bg: #f5f6f8; --card: #ffffff; --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --stripe: #f8fafc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 24px; }
  header .gen { color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    border-left: 5px solid var(--muted); }
  .card .n { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .card .l { color: var(--muted); margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { background: var(--card); border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chart-card h3 { margin: 0 0 10px; font-size: 15px; }
  .chart-card svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    background: var(--c); margin-right: 5px; vertical-align: -1px; }
  .table-card { background: var(--card); border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .table-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .table-head h2 { margin: 0; font-size: 17px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  select, input { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tbody tr:nth-child(even) { background: var(--stripe); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 20px; }
  a { color: var(--active); }
  footer { text-align: center; color: var(--muted); margin-top: 24px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 Job Search Dashboard</h1>
    <div class="gen">Generated: __DATE__</div>
  </header>

  <section class="cards" id="cards"></section>

  <section class="charts">
    <div class="chart-card"><h3>Status breakdown</h3><div id="c-status"></div></div>
    <div class="chart-card"><h3>By sector (sent)</h3><div id="c-sector"></div></div>
    <div class="chart-card"><h3>By channel (sent)</h3><div id="c-channel"></div></div>
    <div class="chart-card"><h3>Application funnel</h3><div id="c-funnel"></div></div>
  </section>

  <section class="table-card">
    <div class="table-head">
      <h2>Applications</h2>
      <div class="filters">
        <select id="f-status" aria-label="Filter by status"><option value="">All statuses</option></select>
        <select id="f-sector" aria-label="Filter by sector"><option value="">All sectors</option></select>
        <input id="f-text" type="search" placeholder="🔍 Company, role, sector…" aria-label="Search">
      </div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Date</th><th>Company</th><th>Role</th><th>Sector</th><th>Channel</th><th>Status</th><th>Fit</th><th>Notes</th><th>Source</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer>Generated by Claude Code · ai-job-search · __DATE__</footer>
</div>

<script>
// Rows from job_search_tracker.csv plus outcome.md stage checkboxes, injected by the refresh step.
const DATA = __DATA__;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BUCKETS = ["Drafted","Active","Interview","Offer","Hired","Rejected/Closed"];
const COLOR = {"Drafted":"var(--drafted)","Active":"var(--active)","Interview":"var(--interview)","Offer":"var(--offer)","Hired":"var(--hired)","Rejected/Closed":"var(--closed)"};
const unknownStatuses = new Set();
function bucket(s) {
  const v = String(s || "").trim().toLowerCase();
  const map = {"drafted":"Drafted","applied":"Active","interview":"Interview","offer":"Offer","hired":"Hired",
    "rejected":"Rejected/Closed","no_response":"Rejected/Closed","no response":"Rejected/Closed",
    "offer_declined":"Rejected/Closed","offer declined":"Rejected/Closed","withdrawn":"Rejected/Closed"};
  if (map[v]) return map[v];
  if (v) unknownStatuses.add(v);
  return "Rejected/Closed";
}
DATA.forEach(r => r.bucket = bucket(r.status));
const sent = DATA.filter(r => r.bucket !== "Drafted");

// Stage reached: current status implies it, or outcome.md checkboxes show it.
const ORDER = {"Active":1,"Interview":2,"Offer":3,"Hired":4};
function reached(r, stage) {
  const level = ORDER[r.bucket] || 1;
  if (level >= ORDER[stage]) return true;
  return (r.outcome_stages || []).some(s => String(s).toLowerCase().includes(stage.toLowerCase()));
}

const counts = Object.fromEntries(BUCKETS.map(b => [b, DATA.filter(r => r.bucket === b).length]));
const cards = [["Sent", sent.length, "var(--muted)"], ["Drafted", counts["Drafted"], COLOR.Drafted],
  ["Active", counts["Active"], COLOR.Active], ["Interview", counts["Interview"], COLOR.Interview],
  ["Offer", counts["Offer"], COLOR.Offer], ["Hired", counts["Hired"], COLOR.Hired],
  ["Rejected/Closed", counts["Rejected/Closed"], COLOR["Rejected/Closed"]]];
document.getElementById("cards").innerHTML = cards.map(([l, n, c]) =>
  `<div class="card" style="border-left-color:${c}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join("");

function noData(msg) {
  return `<svg viewBox="0 0 400 120" role="img" aria-label="${esc(msg)}"><text x="200" y="65" text-anchor="middle" fill="#64748b" font-size="14">${esc(msg)}</text></svg>`;
}

(function () {
  const items = BUCKETS.map(b => [b, counts[b]]).filter(([, n]) => n > 0);
  const total = items.reduce((s, [, n]) => s + n, 0);
  const el = document.getElementById("c-status");
  if (!total) { el.innerHTML = noData("No applications yet"); return; }
  const cx = 110, cy = 110, R = 90, r = 55;
  let a0 = -Math.PI / 2, parts = "";
  const pt = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  items.forEach(([b, n]) => {
    const frac = n / total;
    if (frac >= 0.9999) {
      parts += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${COLOR[b]}" stroke-width="${R - r}"><title>${esc(b)}: ${n}</title></circle>`;
    } else {
      const a1 = a0 + frac * 2 * Math.PI, large = frac > 0.5 ? 1 : 0;
      const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
      parts += `<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${COLOR[b]}"><title>${esc(b)}: ${n}</title></path>`;
      a0 = a1;
    }
  });
  const label = "Status breakdown: " + items.map(([b, n]) => `${n} ${b}`).join(", ");
  el.innerHTML = `<svg viewBox="0 0 220 220" role="img" aria-label="${esc(label)}" style="max-width:240px;margin:0 auto">${parts}
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">${total}</text>
    <text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="12" fill="#64748b">total</text></svg>
    <div class="legend">${items.map(([b, n]) => `<span style="--c:${COLOR[b]}">${esc(b)} (${n})</span>`).join("")}</div>`
    + (unknownStatuses.size ? `<div class="legend">Unrecognised status: ${esc([...unknownStatuses].join(", "))}</div>` : "");
})();

function hbars(elId, items, color, emptyMsg, title) {
  const el = document.getElementById(elId);
  if (!items.length) { el.innerHTML = noData(emptyMsg); return; }
  const max = Math.max(...items.map(([, n]) => n)), rowH = 34, labelW = 150, barW = 210, h = items.length * rowH + 10;
  const rows = items.map(([k, n], i) => {
    const y = 8 + i * rowH, w = max ? Math.max(2, (n / max) * barW) : 2;
    const c = typeof color === "function" ? color(k) : color;
    return `<text x="${labelW - 8}" y="${y + 17}" text-anchor="end" font-size="12" fill="#1e293b">${esc(k.length > 22 ? k.slice(0, 21) + "…" : k)}<title>${esc(k)}</title></text>
      <rect x="${labelW}" y="${y + 4}" width="${w}" height="20" rx="3" fill="${c}"><title>${esc(k)}: ${n}</title></rect>
      <text x="${labelW + w + 6}" y="${y + 18}" font-size="12" fill="#64748b">${n}</text>`;
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 400 ${h}" role="img" aria-label="${esc(title + ": " + items.map(([k, n]) => `${n} ${k}`).join(", "))}">${rows}</svg>`;
}
function countBy(rows, key, fallback) {
  const m = {};
  rows.forEach(r => { const k = (r[key] || "").trim() || fallback; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
hbars("c-sector", countBy(sent, "sector", "Unspecified"), "var(--active)", "No applications sent yet", "By sector");
hbars("c-channel", countBy(sent, "channel", "other"), "var(--offer)", "No applications sent yet", "By channel");
(function () {
  if (!sent.length) { document.getElementById("c-funnel").innerHTML = noData("No applications sent yet"); return; }
  const stages = [["Applied", sent.length], ["Interview", sent.filter(r => reached(r, "Interview")).length],
    ["Offer", sent.filter(r => reached(r, "Offer")).length], ["Hired", sent.filter(r => reached(r, "Hired")).length]];
  const c = {"Applied":"var(--active)","Interview":"var(--interview)","Offer":"var(--offer)","Hired":"var(--hired)"};
  hbars("c-funnel", stages, k => c[k], "", "Application funnel");
})();

const statusSel = document.getElementById("f-status"), sectorSel = document.getElementById("f-sector"), textIn = document.getElementById("f-text");
BUCKETS.filter(b => counts[b]).forEach(b => statusSel.insertAdjacentHTML("beforeend", `<option>${esc(b)}</option>`));
[...new Set(DATA.map(r => r.sector).filter(Boolean))].sort().forEach(s => sectorSel.insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
const dash = v => (String(v || "").trim() ? esc(v) : "—");
const short = v => { const t = String(v || "").trim(); return t ? `<span title="${esc(t)}">${esc(t.length > 80 ? t.slice(0, 79) + "…" : t)}</span>` : "—"; };
function render() {
  const st = statusSel.value, se = sectorSel.value, q = textIn.value.trim().toLowerCase();
  const rows = DATA.filter(r => (!st || r.bucket === st) && (!se || r.sector === se) &&
      (!q || [r.company, r.role, r.sector].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(a.company).localeCompare(String(b.company)));
  document.getElementById("rows").innerHTML = rows.length ? rows.map(r => `<tr>
      <td>${dash(r.date)}</td><td><strong>${dash(r.company)}</strong></td><td>${dash(r.role)}</td><td>${dash(r.sector)}</td>
      <td>${dash(r.channel)}</td><td><span class="pill" style="background:${COLOR[r.bucket]}">${esc(r.bucket)}</span></td>
      <td>${dash(r.fit_rating)}</td><td>${short(r.notes)}</td>
      <td>${/^https?:\/\//.test(r.source || "") ? `<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">Link</a>` : "—"}</td></tr>`).join("")
    : `<tr><td class="empty" colspan="9">No applications match the filters</td></tr>`;
}
[statusSel, sectorSel].forEach(e => e.addEventListener("change", render));
textIn.addEventListener("input", render);
render();
</script>
</body>
</html>
